name: Publish GHCR Image on Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ghcr-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          if [ -n "${{ vars.GHCR_IMAGE_NAME }}" ]; then
            echo "name=${{ vars.GHCR_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${{ github.repository_owner }}/documenso" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=commit-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PRIVATE_TELEMETRY_KEY=${{ secrets.NEXT_PRIVATE_TELEMETRY_KEY }}
            NEXT_PRIVATE_TELEMETRY_HOST=${{ secrets.NEXT_PRIVATE_TELEMETRY_HOST }}
